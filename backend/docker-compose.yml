services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: vertex_markets
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    command: ["npm", "start"]

volumes:
  mongo_data:

